<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Research in Thesis</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <img src="assets/thesis-mark.svg" width="26" height="28" alt="">
      <span>Thesis</span>
    </header>
    <main>
      <h1>Research this article</h1>
      <div class="article" hidden>
        <p id="source"></p>
        <p id="title"></p>
      </div>
      <p id="status" role="status">Reading the current tab…</p>
      <form novalidate>
        <button type="submit" disabled>Open research in Thesis <span aria-hidden="true">↗</span></button>
        <details>
          <summary>Thesis app address</summary>
          <label for="origin">Web app URL</label>
          <input id="origin" type="url" value="http://localhost:3002" required spellcheck="false">
        </details>
      </form>
    </main>
  </body>
</html>
